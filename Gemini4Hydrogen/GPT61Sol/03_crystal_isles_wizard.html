<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crystal Isles · 3D Wizard Adventure</title><style>
:root{color-scheme:dark;--ink:#e8f3ff;--muted:#a5b7ce;--edge:#ffffff26;--glass:#0d1735c9;--accent:#72f4ed}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060d20;color:var(--ink);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}canvas{display:block}#scene{position:fixed;inset:0} .hud{position:fixed;z-index:4;pointer-events:none}.panel{border:1px solid var(--edge);background:linear-gradient(135deg,#15244bdc,#0b112bcf);backdrop-filter:blur(17px);border-radius:17px;padding:16px 19px;box-shadow:0 12px 48px #0005}.top{top:20px;left:20px}.right{top:20px;right:20px;max-width:340px}.bottom{bottom:18px;left:50%;transform:translateX(-50%);text-align:center}.eyebrow{color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:.19em;font-weight:800}h1,h2,p{margin:0}h1{font-size:23px;letter-spacing:.02em}h2{font-size:18px}p{color:var(--muted);margin-top:6px}button,select,input{font:inherit}button{border:1px solid #ffffff40;background:#ffffff14;color:white;border-radius:10px;padding:10px 14px;cursor:pointer;pointer-events:auto;font-weight:750}button:hover{background:#ffffff29}button.primary{background:linear-gradient(110deg,#0fa9b8,#6761ff);border:0}button.active{background:#1a8a7d}input[type=range]{accent-color:#76f5dd;pointer-events:auto}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.stats{display:flex;gap:14px;margin-top:10px}.stat{min-width:66px}.stat b{display:block;font-size:20px}.stat small{font-size:10px;letter-spacing:.13em;color:#a5b7ce;text-transform:uppercase}.meter{height:8px;overflow:hidden;border-radius:8px;background:#ffffff22;margin-top:8px}.fill{height:100%;background:linear-gradient(90deg,#14ebcf,#6c95ff);width:100%;transition:width .2s}.overlay{position:fixed;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;background:#020716c9;backdrop-filter:blur(8px)}.overlay.hidden{display:none}.dialog{max-width:460px;text-align:center;padding:36px 34px;border:1px solid #ffffff3c;border-radius:24px;background:linear-gradient(145deg,#203263,#0b1130);box-shadow:0 30px 90px #0009}.dialog h1{font-size:38px;margin:8px 0}.dialog p{line-height:1.7;margin:12px 0 23px}.help{font-size:12px;color:#a9bbd2}.progress{height:4px;background:#ffffff1b;border-radius:6px;margin:12px 0}.progress span{display:block;height:100%;background:#7df3ed}kbd{background:#fff2;border-radius:4px;padding:2px 4px;font:11px monospace}
</style></head><body><div id="scene"></div><div class="hud top panel"><div class="eyebrow">Skybound / Adventure</div><h1>CRYSTAL ISLES</h1><p>Recover the eight skyshards.</p><div class="stats"><div class="stat"><b id="score">0/8</b><small>Shards</small></div><div class="stat"><b id="health">100</b><small>Health</small></div></div><div class="meter"><div id="hpbar" class="fill"></div></div></div><div class="hud bottom panel help">WASD move · SPACE jump · Drag to orbit camera · Collect glowing crystals · Avoid turret bolts</div><div id="result" class="overlay hidden"><div class="dialog"><div class="eyebrow">Adventure concluded</div><h1 id="resTitle">The End</h1><p id="resText"></p><button class="primary" id="retry">Play again</button></div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';

const container=document.querySelector('#scene'),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;container.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#9dc4fa');scene.fog=new THREE.Fog('#a6c5ff',22,85);const camera=new THREE.PerspectiveCamera(63,innerWidth/innerHeight,.1,120);const ambient=new THREE.HemisphereLight(0xffffff,0x5373a1,2.0);scene.add(ambient);const sun=new THREE.DirectionalLight(0xffecce,2.8);sun.position.set(-10,24,6);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-35;sun.shadow.camera.right=35;sun.shadow.camera.top=35;sun.shadow.camera.bottom=-35;scene.add(sun);
const mat=(c,metal=0)=>new THREE.MeshStandardMaterial({color:c,roughness:.72,metalness:metal});const islandData=[[0,0,0,5],[9,0,0.5,4.6],[8,9,1.1,5.2],[-1,10,1.7,5.1],[-9,5,1,5.2],[-9,-4,-.6,4.6]];const islands=[];function add(o,parent=scene){parent.add(o);return o}function mesh(geo,m,x,y,z,parent=scene){const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
for(let i=0;i<islandData.length;i++){let [x,z,h,r]=islandData[i],group=new THREE.Group();group.position.set(x,h,z);add(group);mesh(new THREE.CylinderGeometry(r,r*.83,.65,10),mat(i%2?'#89c48b':'#8adeb7'),0,-.25,0,group);mesh(new THREE.ConeGeometry(r*.76,3.3,10),mat('#76678e'),0,-2.17,0,group).rotation.y=.15;for(let j=0;j<6;j++){let a=j*6.283/6+i,rr=r*(.45+.25*Math.sin(j*3));const trunk=mesh(new THREE.CylinderGeometry(.11,.16,1.25,6),mat('#b27c83'),Math.cos(a)*rr,.75,Math.sin(a)*rr,group);mesh(new THREE.ConeGeometry(.7,1.75,7),mat(['#b3a3e9','#ed9cc3','#81d5cc'][j%3]),trunk.position.x,1.75,trunk.position.z,group)}islands.push({x,z,h,r})}
// bridges are sturdy sky-stone walkways, with real traversable collision strips
const bridges=[];for(let i=0;i<islands.length;i++){let a=islands[i],b=islands[(i+1)%islands.length],d=Math.hypot(b.x-a.x,b.z-a.z),ang=Math.atan2(b.x-a.x,b.z-a.z),c=mesh(new THREE.BoxGeometry(1.8,.28,d),mat('#e8cde9'),(a.x+b.x)/2,(a.h+b.h)/2-.2,(a.z+b.z)/2);c.rotation.y=ang;bridges.push({a,b,w:1.1})}
const player=new THREE.Group();add(player);const robe=mesh(new THREE.ConeGeometry(.52,1.65,8),mat('#4e4ca9'),0,1.0,0,player);mesh(new THREE.SphereGeometry(.38,10,10),mat('#eac6ab'),0,1.87,0,player);mesh(new THREE.ConeGeometry(.62,1.1,8),mat('#28377c'),0,2.61,0,player);mesh(new THREE.CylinderGeometry(.07,.08,2,8),mat('#9b7050'),.55,1.22,0,player).rotation.z=-.2;let staff=mesh(new THREE.OctahedronGeometry(.22),new THREE.MeshStandardMaterial({color:'#75ffea',emissive:'#14ddb4',emissiveIntensity:2}),.8,2.16,0,player);const light=new THREE.PointLight(0x70f6ff,1.5,5);light.position.set(.8,2.16,0);player.add(light);
const crystals=[],turrets=[],bolts=[],sparks=[];const crystalMat=new THREE.MeshStandardMaterial({color:'#79f4ff',emissive:'#1ab5ee',emissiveIntensity:2,roughness:.1,metalness:.15});for(let i=0;i<8;i++){const isl=islands[[0,1,1,2,3,3,4,5][i]],a=i*2.4+1.3,d= i===0?1.7:isl.r*.43;let o=mesh(new THREE.OctahedronGeometry(.39,0),crystalMat,isl.x+Math.cos(a)*d,isl.h+1.05,isl.z+Math.sin(a)*d);o.userData={base:o.position.y,t:i*.7};crystals.push(o)}for(let i=1;i<islands.length;i++){let it=islands[i],a=i*2.2,x=it.x+Math.cos(a)*2,z=it.z+Math.sin(a)*2;const g=new THREE.Group();g.position.set(x,it.h,z);add(g);mesh(new THREE.CylinderGeometry(.3,.43,.8,7),mat('#39465f',.35),0,.42,0,g);mesh(new THREE.SphereGeometry(.28,10,8),new THREE.MeshStandardMaterial({color:'#ffbb76',emissive:'#eb4f69',emissiveIntensity:2}),0,1.1,0,g);turrets.push({g,t:Math.random()*2})}
let pos=new THREE.Vector3(0,0,0),vy=0,grounded=true,hp=100,got=0,ended=false,inv=0,cameraAz=Math.PI*.3,camElev=.45,drag=false,px=0,py=0,last=performance.now(),elapsed=0;let audio;function sound(freq,duration=.12,type='sine'){try{audio ||= new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.65,audio.currentTime+duration);g.gain.setValueAtTime(.075,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+duration);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch{}}
const keys={};onkeydown=e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();if(e.code==='Space'&&grounded&&!ended){vy=7.8;grounded=false;sound(550)}};onkeyup=e=>keys[e.code]=false;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointermove',e=>{if(drag){cameraAz-=(e.clientX-px)*.005;camElev=THREE.MathUtils.clamp(camElev+(e.clientY-py)*.004,.18,1.05);px=e.clientX;py=e.clientY}});
function floorAt(x,z){let best=-999;for(const isl of islands)if(Math.hypot(x-isl.x,z-isl.z)<isl.r-.25)best=Math.max(best,isl.h);for(const b of bridges){let ax=b.a.x,az=b.a.z,dx=b.b.x-ax,dz=b.b.z-az,t=((x-ax)*dx+(z-az)*dz)/(dx*dx+dz*dz),cl=Math.max(0,Math.min(1,t)),dist=Math.hypot(x-ax-dx*cl,z-az-dz*cl);if(t>=0&&t<=1&&dist<b.w)best=Math.max(best,THREE.MathUtils.lerp(b.a.h,b.b.h,t)-.08)}return best}
function lose(win){ended=true;document.querySelector('#result').classList.remove('hidden');document.querySelector('#resTitle').textContent=win?'SKY SAVED':'SPELL BROKEN';document.querySelector('#resText').textContent=win?'You gathered all eight crystals and restored the floating realm.':'The elemental turrets overwhelmed the wizard. Try another route.';sound(win?920:200,.4,'triangle')}
document.querySelector('#retry').onclick=()=>location.reload();function effect(p,color=0xffdc82){for(let j=0;j<9;j++){let o=mesh(new THREE.SphereGeometry(.07,5,5),new THREE.MeshBasicMaterial({color}),p.x,p.y,p.z);sparks.push({o,v:new THREE.Vector3((Math.random()-.5)*5,Math.random()*5,(Math.random()-.5)*5),life:.5})}}
function step(dt){elapsed+=dt;sun.position.x=Math.sin(elapsed*.08)*22;sun.intensity=2.3+.8*Math.sin(elapsed*.08);if(!ended){let mx=Number(keys.KeyD)-Number(keys.KeyA),mz=Number(keys.KeyS)-Number(keys.KeyW),d=Math.hypot(mx,mz);if(d){mx/=d;mz/=d;let ax=Math.cos(cameraAz),az=-Math.sin(cameraAz),fx=Math.sin(cameraAz),fz=Math.cos(cameraAz);let dx=mx*ax+mz*fx,dz=mx*az+mz*fz;pos.x+=dx*dt*5;pos.z+=dz*dt*5;player.rotation.y=Math.atan2(dx,dz)}vy-=18*dt;pos.y+=vy*dt;let floor=floorAt(pos.x,pos.z);if(pos.y<=floor&&vy<=0&&pos.y>floor-1.6){pos.y=floor;vy=0;grounded=true}else grounded=false;if(pos.y<-14) {hp=0;lose(false)}player.position.copy(pos);if(inv>0)inv-=dt;
for(let i=crystals.length-1;i>=0;i--){let o=crystals[i];o.rotation.y+=dt*2;o.position.y=o.userData.base+Math.sin(elapsed*3+o.userData.t)*.18;if(pos.distanceTo(new THREE.Vector3(o.position.x,o.position.y-1.0,o.position.z))<1.1){effect(o.position,0x5cffed);scene.remove(o);crystals.splice(i,1);got++;sound(830,.23);document.querySelector('#score').textContent=got+'/8';if(got===8)lose(true)}}for(const t of turrets){t.t-=dt;t.g.lookAt(pos.x,t.g.position.y+1,pos.z);let dst=Math.hypot(t.g.position.x-pos.x,t.g.position.z-pos.z);if(dst<13&&t.t<=0){const p=t.g.position.clone().add(new THREE.Vector3(0,1.1,0)),dir=pos.clone().add(new THREE.Vector3(0,1,0)).sub(p).normalize(),o=mesh(new THREE.SphereGeometry(.2,9,7),new THREE.MeshBasicMaterial({color:0xff917d}),p.x,p.y,p.z);bolts.push({o,v:dir.multiplyScalar(7),life:4});t.t=2.5+Math.random()*.9}}}
for(let i=bolts.length-1;i>=0;i--){let b=bolts[i];b.o.position.addScaledVector(b.v,dt);b.life-=dt;if(!ended&&inv<=0&&b.o.position.distanceTo(pos.clone().add(new THREE.Vector3(0,1,0)))<.8){hp=Math.max(0,hp-22);inv=1;effect(b.o.position,0xff947c);sound(180,.23,'sawtooth');document.querySelector('#health').textContent=hp;document.querySelector('#hpbar').style.width=hp+'%';if(hp===0)lose(false);b.life=0}if(b.life<=0){scene.remove(b.o);bolts.splice(i,1)}}for(let i=sparks.length-1;i>=0;i--){let s=sparks[i];s.o.position.addScaledVector(s.v,dt);s.life-=dt;s.o.scale.setScalar(Math.max(.01,s.life*2));if(s.life<0){scene.remove(s.o);sparks.splice(i,1)}}player.visible=inv<=0||Math.floor(inv*12)%2===0}
function animate(now){requestAnimationFrame(animate);let dt=Math.min(.05,(now-last)/1000);last=now;step(dt);let target=pos.clone().add(new THREE.Vector3(Math.sin(cameraAz)*11*Math.cos(camElev),6+Math.sin(camElev)*6,Math.cos(cameraAz)*11*Math.cos(camElev)));camera.position.lerp(target,.09);camera.lookAt(pos.x,pos.y+1,pos.z);renderer.render(scene,camera)}requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

</script></body></html>
