<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas · Procedural Globe</title><style>
:root{color-scheme:dark;--ink:#e8f3ff;--muted:#a5b7ce;--edge:#ffffff26;--glass:#0d1735c9;--accent:#72f4ed}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060d20;color:var(--ink);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}canvas{display:block}#scene{position:fixed;inset:0} .hud{position:fixed;z-index:4;pointer-events:none}.panel{border:1px solid var(--edge);background:linear-gradient(135deg,#15244bdc,#0b112bcf);backdrop-filter:blur(17px);border-radius:17px;padding:16px 19px;box-shadow:0 12px 48px #0005}.top{top:20px;left:20px}.right{top:20px;right:20px;max-width:340px}.bottom{bottom:18px;left:50%;transform:translateX(-50%);text-align:center}.eyebrow{color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:.19em;font-weight:800}h1,h2,p{margin:0}h1{font-size:23px;letter-spacing:.02em}h2{font-size:18px}p{color:var(--muted);margin-top:6px}button,select,input{font:inherit}button{border:1px solid #ffffff40;background:#ffffff14;color:white;border-radius:10px;padding:10px 14px;cursor:pointer;pointer-events:auto;font-weight:750}button:hover{background:#ffffff29}button.primary{background:linear-gradient(110deg,#0fa9b8,#6761ff);border:0}button.active{background:#1a8a7d}input[type=range]{accent-color:#76f5dd;pointer-events:auto}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.stats{display:flex;gap:14px;margin-top:10px}.stat{min-width:66px}.stat b{display:block;font-size:20px}.stat small{font-size:10px;letter-spacing:.13em;color:#a5b7ce;text-transform:uppercase}.meter{height:8px;overflow:hidden;border-radius:8px;background:#ffffff22;margin-top:8px}.fill{height:100%;background:linear-gradient(90deg,#14ebcf,#6c95ff);width:100%;transition:width .2s}.overlay{position:fixed;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;background:#020716c9;backdrop-filter:blur(8px)}.overlay.hidden{display:none}.dialog{max-width:460px;text-align:center;padding:36px 34px;border:1px solid #ffffff3c;border-radius:24px;background:linear-gradient(145deg,#203263,#0b1130);box-shadow:0 30px 90px #0009}.dialog h1{font-size:38px;margin:8px 0}.dialog p{line-height:1.7;margin:12px 0 23px}.help{font-size:12px;color:#a9bbd2}.progress{height:4px;background:#ffffff1b;border-radius:6px;margin:12px 0}.progress span{display:block;height:100%;background:#7df3ed}kbd{background:#fff2;border-radius:4px;padding:2px 4px;font:11px monospace}
</style></head><body><div id="scene"></div><div class="hud top panel"><div class="eyebrow">Cartography / procedural</div><h1>ATLAS <span style="color:#8bf3e3">·</span> 01</h1><p>A world shaped entirely by noise and light.</p><div class="stats"><div class="stat"><b>3D</b><small>Terrain</small></div><div class="stat"><b>2,048</b><small>Orbit lights</small></div></div></div><div class="hud bottom panel" style="min-width:330px;pointer-events:auto"><div class="row" style="justify-content:space-between"><label for="speed">Rotation speed</label><strong id="speedTxt">0.5×</strong></div><input type="range" id="speed" min="0" max="3" step="0.1" value="0.5" style="width:100%"><div class="help">Drag to orbit · Scroll to zoom</div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';

const host=document.querySelector('#scene'),renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;host.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#05101f');scene.fog=new THREE.FogExp2('#05101f',.011);const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,150);camera.position.set(0,1.5,6.9);
scene.add(new THREE.AmbientLight(0x557da3,1.4));const sun=new THREE.DirectionalLight(0xfff5dc,3.8);sun.position.set(5,3,5);scene.add(sun);const back=new THREE.PointLight(0x2ccdfb,30);back.position.set(-4,1,-2);scene.add(back);
function hash(x,y){let a=Math.sin(x*127.1+y*311.7)*43758.5453123;return a-Math.floor(a)}function noise(x,y){let X=Math.floor(x),Y=Math.floor(y),u=x-X,v=y-Y;u=u*u*(3-2*u);v=v*v*(3-2*v);return THREE.MathUtils.lerp(THREE.MathUtils.lerp(hash(X,Y),hash(X+1,Y),u),THREE.MathUtils.lerp(hash(X,Y+1),hash(X+1,Y+1),u),v)}
function fbm(x,y){let sum=0,scale=.5;for(let i=0;i<6;i++){sum+=scale*noise(x,y);x*=2.06;y*=2.05;scale*=.5}return sum}
const lands=[[-1.92,.55,.65,.7],[-1.58,-.3,.35,.47],[-1.1,-.95,.32,.48],[.25,.64,.46,.51],[.72,.1,.44,.5],[1.42,.8,.96,.62],[2.27,.28,.46,.35],[2.5,-.68,.31,.28],[-2.7,.85,.32,.27],[-.65,1.18,.29,.22]];
function landDensity(lon,lat){let val=-.8;for(let [x,y,a,b] of lands){let dlon=Math.atan2(Math.sin(lon-x),Math.cos(lon-x)),v=(dlon/a)**2+((lat-y)/b)**2;val=Math.max(val,1.0-v)}let n=fbm(lon*3.5+13,lat*3.7+3);return val+.32*(n-.47)}
const cv=document.createElement('canvas');cv.width=1024;cv.height=512;const c=cv.getContext('2d'),img=c.createImageData(cv.width,cv.height);
for(let y=0;y<512;y++){let lat=(.5-y/512)*Math.PI;for(let x=0;x<1024;x++){let lon=(x/1024-.5)*Math.PI*2,d=landDensity(lon,lat),n=fbm(lon*8+5,lat*9+6),h=fbm(lon*20,lat*20);let rgb;
if(d>0){if(Math.abs(lat)>1.27 || d>.60&&Math.abs(lat)>.75)rgb=[209,223,215];else if(d>.28)rgb=[122+40*h,123+44*h,102+30*h];else if(Math.abs(lat)<.35)rgb=[34+65*n,110+55*n,59+31*n];else rgb=[65+54*n,123+47*n,80+32*n];if(d<.033)rgb=[178,182,126]}
else {let depth=Math.max(0,Math.min(1,-d*2));rgb=[8+13*n+14*(1-depth),44+29*n+18*(1-depth),89+43*n+25*(1-depth)]}
let p=(y*1024+x)*4;for(let k=0;k<3;k++)img.data[p+k]=rgb[k];img.data[p+3]=255}}
c.putImageData(img,0,0);const texture=new THREE.CanvasTexture(cv);texture.colorSpace=THREE.SRGBColorSpace;texture.anisotropy=8;const globe=new THREE.Group();scene.add(globe);
const planet=new THREE.Mesh(new THREE.SphereGeometry(1.82,96,64),new THREE.MeshStandardMaterial({map:texture,roughness:.92,metalness:.01}));globe.add(planet);
const atm=new THREE.Mesh(new THREE.SphereGeometry(1.91,64,48),new THREE.MeshBasicMaterial({color:0x62caff,transparent:true,opacity:.12,side:THREE.BackSide,depthWrite:false,blending:THREE.AdditiveBlending}));globe.add(atm);
const halo=new THREE.Mesh(new THREE.SphereGeometry(1.98,64,48),new THREE.ShaderMaterial({transparent:true,side:THREE.BackSide,depthWrite:false,vertexShader:'varying vec3 vNormal;varying vec3 vEye;void main(){vec4 w=modelViewMatrix*vec4(position,1.);vNormal=normalize(normalMatrix*normal);vEye=normalize(-w.xyz);gl_Position=projectionMatrix*w;}',fragmentShader:'varying vec3 vNormal;varying vec3 vEye;void main(){float a=pow(1.-abs(dot(vNormal,vEye)),3.4)*.58;gl_FragColor=vec4(.20,.66,1.,a);}' }));globe.add(halo);
const cloudCanvas=document.createElement('canvas');cloudCanvas.width=512;cloudCanvas.height=256;const cx=cloudCanvas.getContext('2d'),ci=cx.createImageData(512,256);for(let y=0;y<256;y++)for(let x=0;x<512;x++){let lon=(x/512-.5)*Math.PI*2,lat=(y/256-.5)*Math.PI,n=fbm(lon*10+75,lat*10+5),p=(y*512+x)*4;ci.data[p]=235;ci.data[p+1]=245;ci.data[p+2]=255;ci.data[p+3]=n>.53?Math.floor(Math.min(100,(n-.53)*650)):0}cx.putImageData(ci,0,0);const clouds=new THREE.Mesh(new THREE.SphereGeometry(1.844,72,48),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cloudCanvas),transparent:true,depthWrite:false,opacity:.75}));globe.add(clouds);
const starsN=1800,starsP=new Float32Array(starsN*3);for(let i=0;i<starsN;i++){let r=25+Math.random()*38,a=Math.random()*6.283,z=Math.random()*2-1,q=Math.sqrt(1-z*z);starsP.set([r*q*Math.cos(a),r*z,r*q*Math.sin(a)],i*3)}const starsGeo=new THREE.BufferGeometry();starsGeo.setAttribute('position',new THREE.BufferAttribute(starsP,3));scene.add(new THREE.Points(starsGeo,new THREE.PointsMaterial({size:.055,color:0xc9e6ff,transparent:true,opacity:.85,sizeAttenuation:true})));
const n=2048,rp=new Float32Array(n*3),rc=new Float32Array(n*3);for(let i=0;i<n;i++){const a=i/n*2*Math.PI,rad=2.48+(.5-Math.random())*.2;rp[i*3]=Math.cos(a)*rad;rp[i*3+1]=Math.sin(a*2)*.08;rp[i*3+2]=Math.sin(a)*rad;let col=new THREE.Color().setHSL(.48+i/n*.17,.93,.65);rc.set(col.toArray(),i*3)}const ringGeo=new THREE.BufferGeometry();ringGeo.setAttribute('position',new THREE.BufferAttribute(rp,3));ringGeo.setAttribute('color',new THREE.BufferAttribute(rc,3));const ring=new THREE.Points(ringGeo,new THREE.PointsMaterial({size:.032,vertexColors:true,transparent:true,opacity:.84,blending:THREE.AdditiveBlending,depthWrite:false}));ring.rotation.x=.38;scene.add(ring);
let dragging=false,px=0,py=0,az=.35,el=.21,dist=6.9;const cvDom=renderer.domElement;cvDom.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;cvDom.setPointerCapture(e.pointerId)});cvDom.addEventListener('pointerup',()=>dragging=false);cvDom.addEventListener('pointermove',e=>{if(!dragging)return;az-=(e.clientX-px)*.005;el=Math.max(-1.2,Math.min(1.2,el+(e.clientY-py)*.005));px=e.clientX;py=e.clientY});cvDom.addEventListener('wheel',e=>{e.preventDefault();dist=THREE.MathUtils.clamp(dist+e.deltaY*.006,3.5,13)},{passive:false});const sl=document.querySelector('#speed'),st=document.querySelector('#speedTxt');sl.addEventListener('input',()=>st.textContent=Number(sl.value).toFixed(1)+'×');
let last=performance.now();function tick(now){requestAnimationFrame(tick);let dt=Math.min(.05,(now-last)/1000);last=now;planet.rotation.y+=dt*.14*sl.value;clouds.rotation.y+=dt*.16*sl.value;ring.rotation.y+=dt*.12;atm.rotation.y-=dt*.03;const pos=new THREE.Vector3(dist*Math.sin(az)*Math.cos(el),dist*Math.sin(el),dist*Math.cos(az)*Math.cos(el));camera.position.lerp(pos,.12);camera.lookAt(0,0,0);renderer.render(scene,camera)}requestAnimationFrame(tick);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

</script></body></html>
